<svg width="100%" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      <![CDATA[
      .title {
        font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #D5FA00;
        letter-spacing: 2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #D5FA00;
        letter-spacing: 1.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 17px;
        font-weight: 500;
        fill: #F6F1E6;
      }
      .motto {
        font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
        font-size: 14px;
        font-weight: 500;
        fill: #BFD0EF;
      }
      ]]>
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="220" rx="16" fill="#27231B" />
  <rect x="1" y="1" width="998" height="218" rx="15" stroke="#687323" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Decorative Window Dots -->
  <circle cx="36" cy="30" r="5" fill="#687323" />
  <circle cx="52" cy="30" r="5" fill="#687323" />
  <circle cx="68" cy="30" r="5" fill="#687323" />

  <!-- Micro-pill Tag -->
  <rect x="790" y="18" width="175" height="26" rx="13" fill="#27231B" stroke="#D5FA00" stroke-width="1" />
  <text x="877" y="35" text-anchor="middle" class="badge-text">ITSM • V3 • V4 • V5</text>

  <!-- Title & Brand Text -->
  <text x="500" y="95" text-anchor="middle" class="title">JEPOY.DEV</text>
  <text x="500" y="135" text-anchor="middle" class="subtitle">ITSM Leader • Cloud Architect • Systems Automation + AI</text>
  <text x="500" y="175" text-anchor="middle" class="motto">Build it. Ship it. | Learn. Build. Launch.</text>

  <!-- Bottom Accent Stripe -->
  <rect x="420" y="195" width="160" height="3" rx="1.5" fill="#D5FA00" />
</svg>